<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FutureSense Create Account</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .form-group {
            display: flex;
            align-items: center;
            margin-bottom: 20px; /* Adjust this value to increase/decrease spacing */
        }
        .form-group label {
            width: 150px; /* Adjust this value to set the label width */
            margin-right: 10px; /* Adjust this value to set the space between label and input */
        }
        .btn {
            margin-top: 20px; /* Adjust this value to increase/decrease spacing */
        }
    </style>
</head>
<body>
<div class="container">
    <div class="logo">
        <img src="../landing-page/futuresensemainlogo.png" alt="FutureSense Logo">
        <h1>FutureSense</h1>
        <p>AI-driven insights for a better tomorrow</p>
    </div>
    <div class="buttons">
        <form id="createAccountForm">
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <label for="confirm-password">Confirm Password:</label>
                <input type="password" id="confirm-password" name="confirm-password" required>
            </div>
            <button type="button" class="btn" onclick="window.location.href='../Terms and conditions/terms-cond.html'">Create Account</button>
        </form>
    </div>
</div>
<script src="createAccount.js"></script>
</body>
</html>
