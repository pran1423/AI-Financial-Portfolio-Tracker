<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>FutureSense | Add Investments</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="logo">
      <h1>Enter Your Investments</h1>
      <p class="subtext">Add your existing investments below.</p>
    </div>

    <div class="investment-form">
      <div class="form-header">
        <h2>Investment Details</h2>
        <span class="tooltip-icon" onclick="openTooltip()">?</span>
      </div>

      <div class="form-group" style="position:relative;">
        <label for="ticker">Stock Ticker</label>
        <input type="text" id="ticker" placeholder="Start typing…">
        <div id="ticker-suggestions" class="suggestions hidden"></div>
      </div>

      <div class="form-group">
        <label for="purchase-date">Date Purchased</label>
        <input type="date" id="purchase-date">
      </div>

      <div class="form-group">
        <label for="total-invested">Total Shares Bought</label>
        <input type="number" id="total-invested" placeholder="Enter number of shares">
      </div>

      <div class="form-group">
        <label for="share-price">Share Price</label>
        <input type="number" id="share-price" placeholder="Auto-filled or edit manually">
      </div>

      <button id="investment-btn" class="btn" onclick="addOrUpdateInvestment()">Add Investment</button>
    </div>

    <div class="investment-list">
      <h2>Investments Added</h2>
      <ul id="investment-display"></ul>
    </div>

    <p id="continue-error" class="error-message hidden">
      Please add at least one investment before continuing.
    </p>
    <button class="btn continue-btn" onclick="checkAndNavigate()">Continue</button>
  </div>

  <span class="tooltip-icon" onclick="openTooltip()">?</span>
  <div id="modal-overlay" class="modal-overlay"></div>
  <div id="tooltip-modal" class="modal">
    <span class="close-btn" onclick="closeTooltip()">✖</span>
    <p>
      You don’t need real investments! Enter dummy values to see how investments grow and learn more.
    </p>
  </div>

  <script src="script.js"></script>
</body>
</html>
