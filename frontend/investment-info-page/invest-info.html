<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investment Information</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
    <h1> Investment Information</h1>
    <div class="step">
        <h2>STEP 1: </h2>
        <div class="progress-bar"></div>
    </div>
    <div class="question">
        <p>DO YOU ALREADY HAVE INVESTMENTS?</p>
        <button id="yesBtn">YES</button>
        <button id="noBtn">NO</button>
    </div>
    <div id="additionalOptions" class="hidden">
        <button>Connect Brokerage Accounts</button>
        <button>Manually Enter Investments</button>
    </div>
    <div class="navigation">
        <button>PREVIOUS</button>
        <button>NEXT</button>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
