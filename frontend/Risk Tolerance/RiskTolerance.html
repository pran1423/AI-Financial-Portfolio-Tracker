<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Risk Tolerance</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(to bottom, #00008B, #000000);
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .container {
            max-width: 600px;
        }
        .header {
            font-size: 24px;
            font-weight: bold;
        }
        .subheader {
            font-size: 18px;
            margin-top: 10px;
        }
        .progress-bar {
            margin: 20px 0;
        }
        .button {
            padding: 10px 20px;
            font-size: 18px;
            border: none;
            cursor: pointer;
            margin: 10px;
            color: white;
            border-radius: 25px;
            font-weight: bold;
            text-transform: uppercase;
            width: 200px;
        }
        .minimal-risk {
            background: linear-gradient(to right, #FC0303 30%, #05011E 70%); /* Less red */
        }
        .medium-risk {
            background: linear-gradient(to right, #FC0303, #05011E); /* Same as before */
        }
        .high-risk {
            background: linear-gradient(to right, #FC0303 0%, #FC0303 50%, #05011E 100%); /* Gradient fading towards the middle */
        }
        .nav-button {
            background: linear-gradient(to bottom, #1E90FF, #00008B);
            position: absolute;
            bottom: 20px;
            padding: 5px 10px; /* Smaller button size */
            font-size: 14px; /* Smaller font size */
            border: none;
            cursor: pointer;
            color: white;
            border-radius: 25px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .nav-button.previous {
            left: 20px;
        }
        .nav-button.next {
            right: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">STEP 2: RISK TOLERANCE</div>
    <div class="subheader">HOW COMFORTABLE ARE YOU WITH INVESTMENT RISK?</div>
    <button class="button minimal-risk">MINIMAL RISK</button>
    <button class="button medium-risk">MEDIUM RISK</button>
    <button class="button high-risk">HIGH RISK</button>
</div>
<button class="nav-button previous">PREVIOUS</button>
<button class="nav-button next">NEXT</button>
</body>
</html>
